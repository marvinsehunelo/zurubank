<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuruBank ATM - Cardless Cashout</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(145deg, #0a0a2e 0%, #1a1a4e 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .atm-container {
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 900px;
            perspective: 1000px;
        }

        .atm-shell {
            background: linear-gradient(135deg, #2a2a3a 0%, #1a1a2a 100%);
            border-radius: 30px 30px 20px 20px;
            padding: 25px 30px 20px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1), 0 0 0 3px #3a3a4a, 0 0 0 6px #1a1a1a;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP BEZEL ===== */
        .atm-top-bezel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 15px 10px;
            border-bottom: 3px solid #3a3a4a;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .atm-branding { text-align: center; }
        .brand-name { 
            font-size: 42px; 
            font-weight: bold; 
            letter-spacing: 4px; 
            color: #ff6b00; 
            text-shadow: 0 0 30px rgba(255,107,0,0.3); 
        }
        .brand-sub { 
            font-size: 16px; 
            color: #888; 
            display: block; 
            letter-spacing: 3px; 
        }
        .security-badge {
            display: inline-block;
            background: #00cc88;
            color: #0a3d2f;
            padding: 4px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* ===== SCREEN ===== */
        .atm-screen {
            background: linear-gradient(145deg, #0a2a3a, #062030);
            width: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 16px;
            padding: 30px 35px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 3px solid #00cc88;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .bank-name { font-size: 22px; font-weight: bold; color: #00cc88; }
        .status-dot { 
            width: 14px; 
            height: 14px; 
            background: #00cc88; 
            border-radius: 50%; 
            display: inline-block; 
            animation: blink 1s infinite;
            margin-right: 10px;
        }
        .screen-time { font-size: 22px; color: #00cc88; font-weight: bold; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .atm-screen-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 16px;
            min-height: 0;
        }

        /* ===== TABS ===== */
        .tabs { 
            display: flex; 
            gap: 15px; 
            flex-shrink: 0;
        }
        .tab-btn {
            background: rgba(0,204,136,0.15);
            border: 2px solid #00cc88;
            padding: 12px 28px;
            color: #00cc88;
            cursor: pointer;
            border-radius: 6px;
            font-size: 18px;
            transition: all 0.2s;
            font-weight: bold;
        }
        .tab-btn.active { 
            background: rgba(0,204,136,0.35); 
            color: #fff; 
            border-color: #ff6b00; 
        }
        .tab-btn:hover { background: rgba(0,204,136,0.25); }

        .tab-content { 
            display: none; 
            flex: 1;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }
        .tab-content.active { display: flex; }

        /* ===== INPUTS ===== */
        .row { 
            display: flex; 
            flex-direction: column; 
            gap: 6px;
            flex-shrink: 0;
        }
        .row label { 
            color: #88ff88; 
            font-size: 18px; 
            letter-spacing: 1px; 
            font-weight: bold;
        }
        .row input {
            width: 100%;
            background: #1a3a2f;
            border: 2px solid #00cc88;
            padding: 14px 20px;
            color: #fff;
            font-size: 24px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
        }
        .row input:focus { 
            outline: none; 
            border-color: #ff6b00; 
            box-shadow: 0 0 20px rgba(255,107,0,0.3); 
        }
        .row input::placeholder { color: #557; font-size: 18px; }

        /* ===== QUICK AMOUNTS ===== */
        .quick-amounts { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .quick-amounts button {
            background: #2a4a3a;
            border: 2px solid #00cc88;
            padding: 12px 28px;
            color: #00cc88;
            cursor: pointer;
            font-size: 20px;
            border-radius: 6px;
            transition: all 0.2s;
            font-weight: bold;
        }
        .quick-amounts button:hover { background: #00cc88; color: #0a3d2f; }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.2s;
            width: 100%;
            flex-shrink: 0;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background: #00cc88; color: #0a3d2f; }
        .btn-primary:hover { background: #00bb77; }

        .btn-secondary { background: #ff6b00; color: white; }
        .btn-secondary:hover { background: #e85e00; }

        .btn-success { background: #2ecc71; color: white; }
        .btn-success:hover { background: #27ae60; }

        /* ===== RESPONSE BOX ===== */
        .response-box {
            padding: 16px 20px;
            background: rgba(0,0,0,0.5);
            border-left: 4px solid #00cc88;
            font-size: 20px;
            border-radius: 6px;
            color: #88ff88;
            min-height: 80px;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            flex-shrink: 0;
            line-height: 1.5;
        }
        .response-box.error { border-left-color: #ff3333; color: #ff8888; }
        .response-box.success { border-left-color: #00cc88; color: #88ff88; background: rgba(0,204,136,0.1); }
        .response-box.info { border-left-color: #3399ff; color: #88ccff; background: rgba(51,153,255,0.1); }
        .response-box.warning { border-left-color: #ff6b00; color: #ffcc88; background: rgba(255,107,0,0.1); }

        /* ===== DISPENSER STATUS ===== */
        .dispenser-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            color: #888;
            font-size: 18px;
            padding: 14px 20px;
            background: #1a1a2a;
            border-radius: 8px;
            flex-shrink: 0;
            margin-top: 6px;
        }
        .dispenser-led {
            width: 14px;
            height: 14px;
            background: #00cc88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* ===== CERT STATUS ===== */
        .cert-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(0,204,136,0.1);
            border-radius: 6px;
            font-size: 16px;
            color: #00cc88;
            flex-shrink: 0;
        }
        .cert-status .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .cert-status .dot.ready { background: #00cc88; }
        .cert-status .dot.error { background: #ff3333; }
        .cert-status .dot.warning { background: #ff6b00; }

        /* ===== STATUS TAB ===== */
        #tab-status {
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        #tab-status.active { display: flex; }

        #statusResult {
            min-height: 100px;
            max-height: 150px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: linear-gradient(135deg, #0a3d2f, #0a2a3a);
            padding: 50px 60px;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            border: 3px solid #00cc88;
            box-shadow: 0 0 60px rgba(0,204,136,0.2);
        }
        .modal-icon { font-size: 80px; margin-bottom: 20px; }
        .modal-title { font-size: 36px; color: #00cc88; margin-bottom: 15px; font-weight: bold; }
        .modal-message { 
            color: #ccffcc; 
            margin-bottom: 20px; 
            white-space: pre-wrap; 
            font-size: 20px; 
            line-height: 1.6;
        }
        .modal-amount { 
            font-size: 48px; 
            color: #ff6b00; 
            margin-bottom: 25px; 
            font-weight: bold; 
        }
        .modal-btn {
            background: #00cc88;
            border: none;
            padding: 16px 50px;
            color: #0a3d2f;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            font-size: 24px;
            transition: all 0.2s;
        }
        .modal-btn:hover { background: #00bb77; transform: scale(1.02); }

        /* ===== LOADING ===== */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            width: 80px;
            height: 80px;
            border: 6px solid #00cc88;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { 
            color: #00cc88; 
            margin-top: 30px; 
            font-size: 28px; 
            letter-spacing: 4px; 
            font-weight: bold;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .atm-shell { padding: 15px 18px; }
            .brand-name { font-size: 28px; }
            .atm-screen { padding: 18px 20px; }
            .bank-name { font-size: 18px; }
            .screen-time { font-size: 18px; }
            .row input { font-size: 20px; padding: 10px 16px; }
            .btn { font-size: 18px; padding: 14px 20px; }
            .response-box { font-size: 16px; min-height: 60px; max-height: 90px; }
            .tab-btn { font-size: 15px; padding: 10px 20px; }
            .quick-amounts button { font-size: 16px; padding: 10px 20px; }
            .modal-content { padding: 30px 35px; }
            .modal-title { font-size: 28px; }
            .modal-message { font-size: 17px; }
            .modal-amount { font-size: 36px; }
            .modal-btn { font-size: 20px; padding: 14px 35px; }
            .loading-text { font-size: 22px; }
            .cert-status { font-size: 14px; }
            .dispenser-status { font-size: 15px; }
        }

        @media (max-width: 500px) {
            .atm-shell { padding: 10px 12px; border-radius: 16px; }
            .brand-name { font-size: 22px; }
            .brand-sub { font-size: 12px; }
            .security-badge { font-size: 10px; padding: 3px 10px; }
            .atm-screen { padding: 12px 14px; border-radius: 10px; }
            .bank-name { font-size: 14px; }
            .screen-time { font-size: 14px; }
            .status-dot { width: 10px; height: 10px; }
            .row label { font-size: 14px; }
            .row input { font-size: 18px; padding: 8px 12px; }
            .row input::placeholder { font-size: 14px; }
            .btn { font-size: 16px; padding: 12px 16px; }
            .response-box { font-size: 14px; min-height: 50px; max-height: 80px; padding: 12px 14px; }
            .tab-btn { font-size: 13px; padding: 8px 14px; }
            .quick-amounts button { font-size: 14px; padding: 8px 14px; }
            .dispenser-status { font-size: 13px; padding: 10px 14px; }
            .cert-status { font-size: 12px; padding: 6px 12px; }
            .modal-content { padding: 25px 20px; }
            .modal-icon { font-size: 60px; }
            .modal-title { font-size: 24px; }
            .modal-message { font-size: 16px; }
            .modal-amount { font-size: 30px; }
            .modal-btn { font-size: 18px; padding: 12px 30px; }
            .loading-text { font-size: 18px; }
            .atm-top-bezel { padding-bottom: 10px; margin-bottom: 12px; }
        }
    </style>
</head>
<body>
    <div class="atm-container">
        <div class="atm-shell">
            <!-- ATM Top -->
            <div class="atm-top-bezel">
                <div class="atm-branding">
                    <span class="brand-name">ZURUBANK</span>
                    <span class="brand-sub">CARDLESS ATM</span>
                </div>
                <span class="security-badge">🔒 BANK-SIGNED</span>
            </div>

            <!-- ATM Screen -->
            <div class="atm-screen">
                <div class="screen-header">
                    <span class="bank-name">🏦 ZURU BANK</span>
                    <div>
                        <span class="status-dot"></span>
                        <span id="screenTime" class="screen-time">--:--</span>
                    </div>
                </div>

                <div class="atm-screen-content">
                    <!-- Tabs -->
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="voucher">🎫 Voucher</button>
                        <button class="tab-btn" data-tab="status">📊 Status</button>
                    </div>

                    <!-- Voucher Tab -->
                    <div id="tab-voucher" class="tab-content active">
                        <div class="row">
                            <label>🎫 Voucher Number</label>
                            <input type="text" id="voucher_number" placeholder="Enter 12-digit voucher number" maxlength="12" autofocus>
                        </div>
                        <div class="row">
                            <label>🔐 Voucher PIN</label>
                            <input type="password" id="voucher_pin" placeholder="Enter 6-digit PIN" maxlength="6">
                        </div>
                        <div class="row">
                            <label>💰 Amount (BWP)</label>
                            <input type="number" id="voucher_amount" placeholder="Enter amount">
                        </div>
                        <div class="quick-amounts">
                            <button onclick="setAmount('voucher_amount', 50)">P50</button>
                            <button onclick="setAmount('voucher_amount', 100)">P100</button>
                            <button onclick="setAmount('voucher_amount', 200)">P200</button>
                            <button onclick="setAmount('voucher_amount', 500)">P500</button>
                            <button onclick="setAmount('voucher_amount', 1000)">P1000</button>
                        </div>
                        <button class="btn btn-primary" onclick="cashoutVoucher()">💵 Dispense Cash</button>
                        <div class="cert-status">
                            <span class="dot ready"></span>
                            <span id="certStatusText">🔒 Bank-Signed Channel — Server Verified</span>
                        </div>
                    </div>

                    <!-- Status Tab -->
                    <div id="tab-status" class="tab-content">
                        <div class="row">
                            <label>🔍 Trace Number</label>
                            <input type="text" id="status_trace" placeholder="Enter trace number to check">
                        </div>
                        <button class="btn btn-success" onclick="checkStatus()">📊 Check Status</button>
                        <div id="statusResult" class="response-box info">Enter a trace number to check status</div>
                    </div>

                    <!-- Response Box -->
                    <div id="responseBox" class="response-box info">✅ ZuruBank ATM ready</div>

                    <!-- Dispenser Status -->
                    <div class="dispenser-status">
                        <span class="dispenser-led"></span>
                        <span>CASH DISPENSER READY</span>
                        <span id="atmIdDisplay" style="color:#444;font-size:14px;">ATM: VIRTUALATM001</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="transactionModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">✅</div>
            <div class="modal-title" id="modalTitle">Transaction Complete</div>
            <div class="modal-message" id="modalMessage">Please take your cash</div>
            <div class="modal-amount" id="modalAmount"></div>
            <button class="modal-btn" onclick="closeModal()">Take Cash →</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">PROCESSING...</div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION - Production ATM
        // ============================================================
        const API_BASE = '/Backend/api/v1';
        const ATM_ID = 'VIRTUALATM001';

        let currentFocus = null;
        let isProcessing = false;

        // ============================================================
        // INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            updateClock();
            setInterval(updateClock, 1000);

            document.getElementById('atmIdDisplay').textContent = 'ATM: ' + ATM_ID;

            // Tab switching
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                    showResponse('Ready for ' + this.textContent.trim(), 'info');
                });
            });

            // Focus tracking
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('focus', function() { currentFocus = this; });
                input.addEventListener('blur', function() {
                    setTimeout(() => { if (document.activeElement !== this) currentFocus = null; }, 100);
                });
            });

            // Enter key support for inputs
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const activeTab = document.querySelector('.tab-content.active');
                        if (activeTab) {
                            const id = activeTab.id;
                            if (id === 'tab-voucher') cashoutVoucher();
                            else if (id === 'tab-status') checkStatus();
                        }
                    }
                });
            });

            showResponse('✅ ZuruBank ATM ready. Enter voucher details.', 'info');
            updateCertStatus(true);
            testConnection();

            // Focus first input
            document.getElementById('voucher_number').focus();
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('screenTime').textContent = now.toLocaleTimeString('en-US', {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
        }

        function setAmount(fieldId, amount) {
            document.getElementById(fieldId).value = amount;
            showResponse(`Amount set to P${amount}`, 'success');
        }

        function showResponse(msg, type = 'info') {
            const box = document.getElementById('responseBox');
            box.className = `response-box ${type}`;
            box.textContent = msg;
        }

        function showLoading(show, msg = 'PROCESSING...') {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                document.querySelector('.loading-text').textContent = msg;
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        function showModal(title, message, amount = null, icon = '✅') {
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            if (amount) {
                document.getElementById('modalAmount').innerHTML = `P${parseFloat(amount).toFixed(2)}`;
                document.getElementById('modalAmount').style.display = 'block';
            } else {
                document.getElementById('modalAmount').style.display = 'none';
            }
            document.getElementById('transactionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('transactionModal').style.display = 'none';
            document.getElementById('voucher_number').value = '';
            document.getElementById('voucher_pin').value = '';
            document.getElementById('voucher_amount').value = '';
            document.getElementById('status_trace').value = '';
            showResponse('Ready for next transaction', 'info');
            document.getElementById('voucher_number').focus();
        }

        // ============================================================
        // UPDATE CERT STATUS
        // ============================================================
        function updateCertStatus(ready) {
            const statusEl = document.getElementById('certStatus');
            const textEl = document.getElementById('certStatusText');
            const dot = statusEl.querySelector('.dot');
            
            if (ready) {
                dot.className = 'dot ready';
                textEl.textContent = '🔒 Bank-Signed Channel — Server Verified';
            } else {
                dot.className = 'dot error';
                textEl.textContent = '⚠️ Signing Unavailable — Check Server Configuration';
            }
        }

        // ============================================================
        // API CALL
        // ============================================================
        async function callAPI(endpoint, data) {
            try {
                const url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
                console.log(`Calling API: ${url}`, data);

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-ATM-ID': ATM_ID,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify(data)
                });

                console.log(`Response Status: ${response.status}`);

                const responseText = await response.text();
                console.log('Raw response (first 500 chars):', responseText.substring(0, 500));

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${responseText.substring(0, 200)}`);
                }

                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    if (responseText.trim().startsWith('<!DOCTYPE') || responseText.trim().startsWith('<')) {
                        const htmlPreview = responseText.substring(0, 300);
                        throw new Error(`Server returned HTML instead of JSON. First 300 chars: ${htmlPreview}`);
                    }
                    throw new Error(`Invalid JSON: ${responseText.substring(0, 100)}`);
                }

                console.log('API Response:', result);
                return result;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // ============================================================
        // VOUCHER CASHOUT
        // ============================================================
        async function cashoutVoucher() {
            if (isProcessing) return;

            const voucherNumber = document.getElementById('voucher_number').value.trim();
            const voucherPin = document.getElementById('voucher_pin').value.trim();
            const amount = parseFloat(document.getElementById('voucher_amount').value);

            if (!voucherNumber) { showResponse('❌ Enter voucher number', 'error'); return; }
            if (!voucherPin) { showResponse('❌ Enter voucher PIN', 'error'); return; }
            if (!amount || amount < 10) { showResponse('❌ Enter valid amount (min P10)', 'error'); return; }

            isProcessing = true;
            showLoading(true, '🔐 Verifying transaction...');

            try {
                updateCertStatus(true);
                showResponse('🔐 Bank-signed channel. Processing voucher...', 'info');

                const result = await callAPI('/atm/atm_cashout.php', {
                    voucher_number: voucherNumber,
                    voucher_pin: voucherPin,
                    amount: amount,
                    atm_id: ATM_ID,
                    action: 'CASHOUT'
                });

                showLoading(false);

                if (result.status === 'CASHOUT_SUCCESS' || result.success === true) {
                    showModal(
                        '💵 CASH DISPENSED',
                        `Voucher withdrawal successful!\nVoucher: ${voucherNumber}\nRef: ${result.cashout_reference || result.reference || 'N/A'}\n🔒 Bank-Signed Channel`,
                        result.amount || amount,
                        '💵'
                    );
                    showResponse(`✅ ${result.message || 'Cash dispensed successfully!'}`, 'success');
                    
                    console.log('TRANSACTION:', {
                        voucher: voucherNumber,
                        amount: amount,
                        reference: result.cashout_reference,
                        channel: 'bank-signed',
                        timestamp: new Date().toISOString()
                    });
                } else {
                    showResponse(`❌ ${result.message || result.error || 'Transaction declined'}`, 'error');
                }
            } catch (error) {
                showLoading(false);
                showResponse(`❌ Error: ${error.message}`, 'error');
                updateCertStatus(false);
            } finally {
                isProcessing = false;
            }
        }

        // ============================================================
        // CHECK STATUS
        // ============================================================
        async function checkStatus() {
            if (isProcessing) return;

            const trace = document.getElementById('status_trace').value.trim();

            if (!trace) { showResponse('❌ Enter trace number', 'error'); return; }

            isProcessing = true;
            showLoading(true, 'Checking status...');

            try {
                const result = await callAPI('/transaction/status.php', {
                    trace_number: trace,
                    atm_id: ATM_ID
                });

                showLoading(false);

                const statusResult = document.getElementById('statusResult');
                if (result.status === 'SUCCESS' || result.success === true) {
                    const data = result.data || result;
                    statusResult.className = 'response-box success';
                    statusResult.innerHTML = `
                        ✅ Transaction Found\n
                        Trace: ${data.trace_number || trace}\n
                        Amount: P${data.amount || 0}\n
                        Status: ${data.status || 'COMPLETED'}\n
                        Reference: ${data.reference || 'N/A'}\n
                        Time: ${data.timestamp || data.created_at || new Date().toLocaleString()}\n
                        🔒 Channel: ${data.signature_verified ? 'Bank-Signed ✓' : 'Standard'}
                    `;
                } else {
                    statusResult.className = 'response-box error';
                    statusResult.textContent = `❌ ${result.message || 'Transaction not found'}`;
                }
            } catch (error) {
                showLoading(false);
                const statusResult = document.getElementById('statusResult');
                statusResult.className = 'response-box error';
                statusResult.textContent = `❌ Error: ${error.message}`;
            } finally {
                isProcessing = false;
            }
        }

        // ============================================================
        // TEST CONNECTION
        // ============================================================
        async function testConnection() {
            try {
                const response = await fetch(`${API_BASE}/auth.php`, {
                    method: 'HEAD',
                    headers: { 'X-ATM-ID': ATM_ID }
                });
                if (response.ok || response.status === 405) {
                    showResponse('✅ Connected to ZuruBank backend', 'success');
                    updateCertStatus(true);
                } else {
                    showResponse(`⚠️ Backend returned ${response.status}`, 'error');
                    updateCertStatus(false);
                }
            } catch (error) {
                showResponse(`⚠️ Cannot connect to backend: ${error.message}`, 'error');
                updateCertStatus(false);
            }
        }

        // ============================================================
        // LOGGING
        // ============================================================
        function logTransaction(data) {
            console.log('🔒 TRANSACTION LOG:', {
                ...data,
                timestamp: new Date().toISOString(),
                atm_id: ATM_ID,
                channel: 'bank-signed'
            });
        }

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
