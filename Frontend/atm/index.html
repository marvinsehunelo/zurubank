<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZuruBank ATM — Cardless Cashout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0E2226;        /* kiosk shell — near-black brushed steel */
    --steel: #3C4E52;      /* shell highlight / mid metal */
    --steel-lo: #182D31;   /* shell shadow */
    --teal: #0B5C63;       /* ZuruBank brand */
    --teal-dk: #084046;
    --gold: #C89B3C;       /* accent — action + cash */
    --gold-lt: #E4C077;
    --screen: #F3F6F5;     /* banking software screen background */
    --paper: #FFFFFF;
    --line: #D8E1DF;
    --text: #142221;
    --text-soft: #5B6E6C;
    --danger: #B23B32;
    --danger-bg: #FBEEEC;
    --ok: #1E7A55;
    --ok-bg: #E9F5EE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #1c3438 0%, #0a1416 60%, #060b0c 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vw, 32px);
    color: var(--text);
  }
  .kiosk-wrap { width: 100%; max-width: 980px; }

  /* ================= KIOSK SHELL ================= */
  .kiosk {
    background:
      linear-gradient(155deg, var(--steel) 0%, var(--ink) 45%, var(--steel-lo) 100%);
    border-radius: 22px 22px 14px 14px;
    padding: 22px 22px 18px;
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,0.65),
      0 2px 0 rgba(255,255,255,0.06) inset,
      0 0 0 1px rgba(0,0,0,0.4);
    position: relative;
  }
  .kiosk::before {
    /* brushed-metal texture */
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: repeating-linear-gradient(100deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
  }
  .kiosk-screws { position: absolute; inset: 10px; pointer-events: none; }
  .screw { position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #6a7a7d, #0c1718 70%);
    box-shadow: 0 1px 1px rgba(255,255,255,0.15) inset; }
  .screw.tl { top: 0; left: 0; } .screw.tr { top: 0; right: 0; }
  .screw.bl { bottom: 0; left: 0; } .screw.br { bottom: 0; right: 0; }

  .fascia-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 10px 16px; position: relative; z-index: 1;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-mark {
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 22px;
    letter-spacing: 0.5px; color: #EAF3F2;
  }
  .brand-mark span { color: var(--gold-lt); }
  .brand-sub { font-size: 11px; letter-spacing: 2.5px; color: #8CA3A2; text-transform: uppercase; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(200,155,60,0.14); border: 1px solid rgba(200,155,60,0.4);
    color: var(--gold-lt); font-size: 11px; font-weight: 600; letter-spacing: 0.6px;
    padding: 5px 12px; border-radius: 20px; text-transform: uppercase;
  }
  .badge svg { width: 12px; height: 12px; }

  /* ================= SCREEN (banking software) ================= */
  .screen {
    background: var(--screen);
    border-radius: 12px;
    box-shadow: 0 0 0 8px #0d1a1c, 0 0 0 9px rgba(255,255,255,0.05), inset 0 2px 10px rgba(0,0,0,0.12);
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    min-height: 560px;
  }
  .screen-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  .screen-bar .who { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--teal-dk); font-size: 15px; }
  .screen-bar .who svg { width: 18px; height: 18px; }
  .clock { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--text-soft); font-size: 14px; font-variant-numeric: tabular-nums; }
  .clock::before { content: '●'; color: var(--ok); font-size: 8px; margin-right: 7px; vertical-align: middle; animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .tabs { display: flex; gap: 4px; padding: 14px 20px 0; }
  .tab {
    display: flex; align-items: center; gap: 7px;
    background: transparent; border: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-soft);
    padding: 10px 16px; border-radius: 8px 8px 0 0;
    border-bottom: 2px solid transparent;
  }
  .tab svg { width: 15px; height: 15px; }
  .tab.active { color: var(--teal-dk); border-bottom-color: var(--gold); background: rgba(11,92,99,0.06); }

  .panes { flex: 1; padding: 18px 24px 22px; display: flex; flex-direction: column; }
  .pane { display: none; flex-direction: column; gap: 16px; flex: 1; }
  .pane.active { display: flex; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: var(--text-soft); text-transform: uppercase; }
  .field .control {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 9px;
    padding: 0 14px; transition: border-color .15s, box-shadow .15s;
  }
  .field .control:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(11,92,99,0.12); }
  .field .control svg { width: 17px; height: 17px; color: var(--text-soft); flex-shrink: 0; }
  .field input {
    border: none; outline: none; background: transparent; width: 100%;
    padding: 12px 0; font-size: 16px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-weight: 500;
    letter-spacing: 0.5px;
  }
  .field input::placeholder { color: #9AACAA; font-family: 'IBM Plex Sans', sans-serif; letter-spacing: normal; font-weight: 400; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13.5px;
    background: var(--paper); border: 1.5px solid var(--line); color: var(--teal-dk);
    padding: 7px 15px; border-radius: 8px; cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--gold); background: #FBF6EA; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; padding: 14px; border: none; border-radius: 9px;
    font-family: inherit; font-weight: 700; font-size: 14.5px; letter-spacing: 0.3px;
    cursor: pointer; transition: transform .1s, box-shadow .15s; text-transform: uppercase;
  }
  .btn svg { width: 17px; height: 17px; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: linear-gradient(180deg, var(--teal) 0%, var(--teal-dk) 100%); color: #fff; box-shadow: 0 6px 16px -6px rgba(11,92,99,0.6); }
  .btn-primary:hover { box-shadow: 0 8px 20px -6px rgba(11,92,99,0.75); }
  .btn-ghost { background: var(--paper); color: var(--teal-dk); border: 1.5px solid var(--line); }

  .status-line {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-soft);
    padding-top: 2px;
  }
  .status-line .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .status-line .dot.warn { background: var(--danger); }

  .console {
    margin-top: auto;
    background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--teal);
    border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--text-soft);
    min-height: 44px; max-height: 90px; overflow-y: auto; line-height: 1.5;
  }
  .console.error { border-left-color: var(--danger); background: var(--danger-bg); color: #7a2c26; }
  .console.success { border-left-color: var(--ok); background: var(--ok-bg); color: #17563c; }

  /* ================= DISPENSER SLOT ================= */
  .dispenser {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 14px; padding: 10px 16px;
    background: linear-gradient(180deg, #0a1618, #060d0e);
    border-radius: 0 0 8px 8px; position: relative; z-index: 1;
  }
  .dispenser .slot {
    width: min(320px, 60%); height: 10px; border-radius: 5px;
    background: repeating-linear-gradient(90deg, #000 0px, #000 6px, #1a2a2c 6px, #1a2a2c 8px);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
  }
  .dispenser .led { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  .dispenser .label { font-size: 10.5px; letter-spacing: 1.5px; color: #7C918F; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; }

  /* ================= KEYPAD ================= */
  .keypad-dock { display: flex; justify-content: flex-end; padding: 10px 4px 0; position: relative; z-index: 1; }
  .keypad { display: grid; grid-template-columns: repeat(3, 52px); gap: 7px; }
  .kp {
    height: 42px; border-radius: 7px; border: none; cursor: pointer;
    background: linear-gradient(180deg, #4a5d60, #33474a);
    color: #EAF3F2; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px;
    box-shadow: 0 2px 0 #1b2b2d, 0 3px 6px rgba(0,0,0,0.35);
  }
  .kp:active { transform: translateY(2px); box-shadow: 0 0 0 #1b2b2d; }
  .kp.clear { background: linear-gradient(180deg, #7a3d34, #5c241d); }
  .kp.enter { background: linear-gradient(180deg, var(--gold), #9a7526); color: #241a05; }

  /* ================= MODAL ================= */
  .modal { display: none; position: fixed; inset: 0; background: rgba(6,12,13,0.78); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-card {
    background: var(--paper); border-radius: 18px; padding: 34px 32px 30px; max-width: 420px; width: 100%;
    text-align: center; box-shadow: 0 30px 70px rgba(0,0,0,0.4);
  }
  .modal-icon-wrap { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-bg); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .modal-icon-wrap svg { width: 28px; height: 28px; color: var(--ok); }
  .modal-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .modal-msg { font-size: 13.5px; color: var(--text-soft); white-space: pre-line; line-height: 1.6; margin-bottom: 20px; }

  /* signature: illustrated banknote */
  .banknote {
    position: relative; margin: 0 auto 22px; width: 100%; max-width: 300px; height: 130px;
    border-radius: 10px; overflow: hidden;
    background:
      radial-gradient(120px 120px at 85% 50%, rgba(255,255,255,0.14), transparent 70%),
      linear-gradient(135deg, #0B5C63 0%, #0E4B50 55%, #084046 100%);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 14px 30px -10px rgba(11,92,99,0.5);
    display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
  }
  .banknote::before {
    content: ''; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 5px);
  }
  .banknote-amount { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 30px; color: #F3F6F5; letter-spacing: 0.5px; z-index: 1; }
  .banknote-mark { font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 12px; color: rgba(255,255,255,0.55); letter-spacing: 2px; text-transform: uppercase; z-index: 1; text-align: right; line-height: 1.6; }
  .banknote-seal {
    position: absolute; left: 18px; bottom: 14px; width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px dashed rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.5); font-weight: 700;
  }

  .modal-ref { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-soft); background: #F3F6F5; border-radius: 6px; padding: 8px 12px; margin-bottom: 20px; }
  .modal-btn { width: 100%; }

  /* ================= LOADING ================= */
  .loading { display: none; position: fixed; inset: 0; background: rgba(6,12,13,0.9); z-index: 1001; align-items: center; justify-content: center; flex-direction: column; gap: 18px; }
  .spinner { width: 46px; height: 46px; border: 4px solid rgba(200,155,60,0.25); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-family: 'IBM Plex Mono', monospace; color: #EAF3F2; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

  .atm-id { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #567; }

  @media (max-width: 720px) {
    .keypad-dock { justify-content: center; }
    .fascia-top { flex-direction: column; gap: 10px; align-items: flex-start; }
  }
  @media (max-width: 480px) {
    .keypad { grid-template-columns: repeat(3, 1fr); width: 100%; }
    .panes { padding: 16px 16px 18px; }
    .brand-mark { font-size: 19px; }
  }

  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>

<div class="kiosk-wrap">
  <div class="kiosk">
    <div class="kiosk-screws"><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>

    <div class="fascia-top">
      <div class="brand">
        <span class="brand-mark">Zuru<span>Bank</span></span>
        <span class="brand-sub">Cardless ATM</span>
      </div>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        Bank-signed channel
      </span>
    </div>

    <div class="screen">
      <div class="screen-bar">
        <span class="who">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>
          Zuru Bank
        </span>
        <span id="screenTime" class="clock">--:--:--</span>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="voucher">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/></svg>
          Cash-out voucher
        </button>
        <button class="tab" data-tab="status">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-6 3 3 5-8"/></svg>
          Transaction status
        </button>
      </div>

      <div class="panes">
        <div id="pane-voucher" class="pane active">
          <div class="field">
            <label for="voucher_number">Voucher number</label>
            <div class="control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/></svg>
              <input type="text" id="voucher_number" placeholder="12-digit voucher number" maxlength="12" autofocus>
            </div>
          </div>
          <div class="field">
            <label for="voucher_pin">Voucher PIN</label>
            <div class="control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="voucher_pin" placeholder="6-digit PIN" maxlength="6" inputmode="numeric">
            </div>
          </div>
          <div class="field">
            <label for="voucher_amount">Amount (BWP)</label>
            <div class="control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1 1-1.5 3-1.5s3 1 3 2-1 1.5-3 1.5-3 .5-3 1.5 1 2 3 2 3-.5 3-1.5"/></svg>
              <input type="number" id="voucher_amount" placeholder="0.00">
            </div>
          </div>
          <div class="chips">
            <button class="chip" onclick="setAmount(50)">P50</button>
            <button class="chip" onclick="setAmount(100)">P100</button>
            <button class="chip" onclick="setAmount(200)">P200</button>
            <button class="chip" onclick="setAmount(500)">P500</button>
            <button class="chip" onclick="setAmount(1000)">P1000</button>
          </div>
          <button class="btn btn-primary" onclick="cashoutVoucher()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
            Dispense cash
          </button>
          <div class="status-line" id="certStatus"><span class="dot"></span><span id="certStatusText">Bank-signed channel — server verified</span></div>
          <div id="responseBox" class="console">ZuruBank ATM ready. Enter your voucher details to begin.</div>
        </div>

        <div id="pane-status" class="pane">
          <div class="field">
            <label for="status_trace">Trace number</label>
            <div class="control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="status_trace" placeholder="Enter trace number">
            </div>
          </div>
          <button class="btn btn-ghost" onclick="checkStatus()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-6 3 3 5-8"/></svg>
            Check status
          </button>
          <div id="statusResult" class="console">Enter a trace number to check a transaction.</div>
        </div>
      </div>
    </div>

    <div class="dispenser">
      <span class="led"></span>
      <span class="slot"></span>
      <span class="label">Cash dispenser</span>
      <span class="atm-id" id="atmIdDisplay"></span>
    </div>

    <div class="keypad-dock">
      <div class="keypad">
        <button class="kp" data-key="1">1</button><button class="kp" data-key="2">2</button><button class="kp" data-key="3">3</button>
        <button class="kp" data-key="4">4</button><button class="kp" data-key="5">5</button><button class="kp" data-key="6">6</button>
        <button class="kp" data-key="7">7</button><button class="kp" data-key="8">8</button><button class="kp" data-key="9">9</button>
        <button class="kp clear" data-key="clear">C</button><button class="kp" data-key="0">0</button><button class="kp enter" data-key="enter">↵</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="transactionModal">
  <div class="modal-card">
    <div class="modal-icon-wrap" id="modalIconWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div class="modal-title" id="modalTitle">Cash dispensed</div>
    <div class="banknote" id="modalBanknote">
      <div class="banknote-seal">ZB</div>
      <span class="banknote-amount" id="modalAmount">P0.00</span>
      <span class="banknote-mark">Zuru<br>Bank</span>
    </div>
    <div class="modal-msg" id="modalMessage">Please take your cash.</div>
    <div class="modal-ref" id="modalRef"></div>
    <button class="btn btn-primary modal-btn" onclick="closeModal()">Take cash</button>
  </div>
</div>

<div class="loading" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Processing</div>
</div>

<script>
  const API_BASE = '/Backend/api/v1';
  const ATM_ID = 'VIRTUALATM001';
  let currentFocus = null;
  let isProcessing = false;

  document.addEventListener('DOMContentLoaded', function() {
    updateClock(); setInterval(updateClock, 1000);
    document.getElementById('atmIdDisplay').textContent = 'ATM ' + ATM_ID;

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('pane-' + this.dataset.tab).classList.add('active');
      });
    });

    document.querySelectorAll('.keypad .kp').forEach(btn => {
      btn.addEventListener('click', () => handleKeyInput(btn.dataset.key));
    });

    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', function () { currentFocus = this; });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          const activePane = document.querySelector('.pane.active').id;
          if (activePane === 'pane-voucher') cashoutVoucher(); else checkStatus();
        }
      });
    });

    showResponse('ZuruBank ATM ready. Enter your voucher details to begin.', 'info');
    testConnection();
    document.getElementById('voucher_number').focus();
  });

  function handleKeyInput(key) {
    if (!currentFocus) return;
    if (key === 'clear') { currentFocus.value = ''; return; }
    if (key === 'enter') {
      const activePane = document.querySelector('.pane.active').id;
      if (activePane === 'pane-voucher') cashoutVoucher(); else checkStatus();
      return;
    }
    currentFocus.value += key;
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('screenTime').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  function setAmount(v) {
    document.getElementById('voucher_amount').value = v;
    showResponse(`Amount set to P${v}`, 'success');
  }

  function showResponse(msg, type = 'info') {
    const box = document.getElementById('responseBox');
    box.className = `console ${type === 'info' ? '' : type}`;
    box.textContent = msg;
  }

  function showLoading(show, msg = 'Processing') {
    document.getElementById('loadingText').textContent = msg;
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
  }

  function showModal(title, message, amount, ref, ok = true) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    document.getElementById('modalRef').textContent = ref ? `Reference ${ref}` : '';
    document.getElementById('modalRef').style.display = ref ? 'block' : 'none';
    document.getElementById('modalBanknote').style.display = ok ? 'flex' : 'none';
    if (amount) document.getElementById('modalAmount').textContent = `P${parseFloat(amount).toFixed(2)}`;
    const iconWrap = document.getElementById('modalIconWrap');
    iconWrap.style.background = ok ? 'var(--ok-bg)' : 'var(--danger-bg)';
    iconWrap.querySelector('svg').style.color = ok ? 'var(--ok)' : 'var(--danger)';
    document.getElementById('transactionModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('transactionModal').style.display = 'none';
    ['voucher_number', 'voucher_pin', 'voucher_amount', 'status_trace'].forEach(id => document.getElementById(id).value = '');
    showResponse('Ready for next transaction.', 'info');
    document.getElementById('voucher_number').focus();
  }

  function updateCertStatus(ready) {
    const line = document.getElementById('certStatus');
    const dot = line.querySelector('.dot');
    const text = document.getElementById('certStatusText');
    dot.classList.toggle('warn', !ready);
    text.textContent = ready ? 'Bank-signed channel — server verified' : 'Signing unavailable — check server configuration';
  }

  async function callAPI(endpoint, data) {
    const url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-ATM-ID': ATM_ID, 'X-Requested-With': 'XMLHttpRequest' },
      body: JSON.stringify(data)
    });
    const responseText = await response.text();
    if (!response.ok) throw new Error(`HTTP ${response.status}: ${responseText.substring(0, 200)}`);
    try {
      return JSON.parse(responseText);
    } catch {
      if (responseText.trim().startsWith('<')) throw new Error(`Server returned HTML instead of JSON: ${responseText.substring(0, 200)}`);
      throw new Error(`Invalid JSON: ${responseText.substring(0, 100)}`);
    }
  }

  async function cashoutVoucher() {
    if (isProcessing) return;
    const voucherNumber = document.getElementById('voucher_number').value.trim();
    const voucherPin = document.getElementById('voucher_pin').value.trim();
    const amount = parseFloat(document.getElementById('voucher_amount').value);

    if (!voucherNumber) { showResponse('Enter the voucher number.', 'error'); return; }
    if (!voucherPin) { showResponse('Enter the voucher PIN.', 'error'); return; }
    if (!amount || amount < 10) { showResponse('Enter a valid amount (minimum P10).', 'error'); return; }

    isProcessing = true;
    showLoading(true, 'Verifying transaction');
    try {
      updateCertStatus(true);
      showResponse('Bank-signed channel confirmed. Processing voucher…', 'info');
      const result = await callAPI('/atm/atm_cashout.php', { voucher_number: voucherNumber, voucher_pin: voucherPin, amount, atm_id: ATM_ID, action: 'CASHOUT' });
      showLoading(false);
      if (result.status === 'CASHOUT_SUCCESS' || result.success === true) {
        showModal('Cash dispensed', `Voucher ${voucherNumber} redeemed successfully.`, result.amount || amount, result.cashout_reference || result.reference, true);
        showResponse(result.message || 'Cash dispensed successfully.', 'success');
      } else {
        showResponse(result.message || result.error || 'Transaction declined.', 'error');
      }
    } catch (err) {
      showLoading(false);
      showResponse('Error: ' + err.message, 'error');
      updateCertStatus(false);
    } finally {
      isProcessing = false;
    }
  }

  async function checkStatus() {
    if (isProcessing) return;
    const trace = document.getElementById('status_trace').value.trim();
    if (!trace) { setStatusResult('Enter a trace number.', 'error'); return; }

    isProcessing = true;
    showLoading(true, 'Checking status');
    try {
      const result = await callAPI('/transaction/status.php', { trace_number: trace, atm_id: ATM_ID });
      showLoading(false);
      if (result.status === 'SUCCESS' || result.success === true) {
        const d = result.data || result;
        setStatusResult(
          `Trace ${d.trace_number || trace} — ${d.status || 'COMPLETED'}\nAmount P${d.amount || 0}  ·  Ref ${d.reference || 'n/a'}\n${d.timestamp || d.created_at || ''}  ·  Signature ${d.signature_verified ? 'verified' : 'standard'}`,
          'success'
        );
      } else {
        setStatusResult(result.message || 'Transaction not found.', 'error');
      }
    } catch (err) {
      showLoading(false);
      setStatusResult('Error: ' + err.message, 'error');
    } finally {
      isProcessing = false;
    }
  }

  function setStatusResult(msg, type) {
    const box = document.getElementById('statusResult');
    box.className = `console ${type === 'info' ? '' : type}`;
    box.textContent = msg;
  }

  async function testConnection() {
    try {
      const response = await fetch(`${API_BASE}/auth.php`, { method: 'HEAD', headers: { 'X-ATM-ID': ATM_ID } });
      if (response.ok || response.status === 405) { showResponse('Connected to ZuruBank backend.', 'success'); updateCertStatus(true); }
      else { showResponse(`Backend returned ${response.status}.`, 'error'); updateCertStatus(false); }
    } catch (err) {
      showResponse('Cannot reach backend: ' + err.message, 'error');
      updateCertStatus(false);
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
